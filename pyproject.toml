[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "dataiter"
dynamic = ["version"]
description = "Simple, light-weight data frames for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12.0"
authors = [{ name = "Osmo Salomaa", email = "otsaloma@iki.fi" }]
dependencies = ["attd>=0.3", "numpy>=2.5.0,<3.0", "pyarrow>=26.0", "wcwidth>=0.3.0"]

[dependency-groups]
dev = [
    "click",
    "flake8",
    "jinja2==3.1.6",
    "pandas",
    "pytest",
    "sphinx==8.1.3",
    "sphinx-llm==1.1.0",
    "sphinx-rtd-theme==3.1.0",
]

[project.urls]
Homepage = "https://github.com/otsaloma/dataiter"
Documentation = "https://dataiter.readthedocs.io/"
Changelog = "https://github.com/otsaloma/dataiter/blob/master/NEWS.md"

[tool.hatch.version]
path = "dataiter/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/dataiter"]
